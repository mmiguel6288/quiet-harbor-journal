<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice check</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Inter:wght@400;600;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#161410;--card:#221e19;--ink:#efe6cf;--mut:#b9ad8f;--acc:#d9a441}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
body{padding:calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
header{max-width:1040px;margin:0 auto 18px}
.tag{font:11px/1.3 'Special Elite',monospace;color:var(--acc);letter-spacing:.08em}
h1{font:700 26px/1.2 'Libre Baskerville',serif;margin:4px 0 8px;color:#f3e7c6}
.lede{max-width:40rem;color:var(--mut);margin:0}
.grid{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#2b2b2b}
.meta{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta b{font:700 15px/1.25 'Libre Baskerville',serif;color:#f3e7c6}
.vid{font:600 11.5px/1.35 'IBM Plex Mono',ui-monospace,monospace;color:var(--mut);letter-spacing:.01em}
.play{margin-top:auto;border:0;border-radius:999px;padding:8px 12px;background:#2a251f;color:#eadfc4;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.play:hover,.play:focus{background:#3a332b;outline:none}
.play[aria-pressed="true"]{background:var(--acc);color:#1c1a17}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)} h1{font-size:30px}}
</style>
</head>
<body>
<header>
  <div class="tag">VOICE CHECK · NOT PART OF THE CASE</div>
  <h1>Interview voices</h1>
  <p class="lede">A short hello from each person you can interview, plus Walt from the practice interview. These are the same voices used in the game. Nothing here is about the case.</p>
</header>
<main class="grid" id="grid"></main>
<script>
const PEOPLE=[
  {id:'delia',name:'Delia Whitcombe-Park',img:'../img/delia.jpg',voice:'af_sarah',speed:'1.08',src:'delia.mp3'},
  {id:'owen',name:'Owen Whitcombe',img:'../img/owen.jpg',voice:'am_adam',speed:'1.0',src:'owen.mp3'},
  {id:'margo',name:'Margo Whitcombe',img:'../img/margo.jpg',voice:'af_alloy',speed:'1.04',src:'margo.mp3'},
  {id:'kira',name:'Lena Whitcombe',img:'../img/kira.jpg',voice:'af_bella',speed:'1.0',src:'kira.mp3'},
  {id:'teddy',name:'Teddy Alcott',img:'../img/teddy.jpg',voice:'am_onyx',speed:'0.98',src:'teddy.mp3'},
  {id:'rosa',name:'Rosa Delgado',img:'../img/rosa.jpg',voice:'ef_dora',speed:'1.0',lang:'es',src:'rosa.mp3'},
  {id:'walt',name:'Walt Penrose',img:'../img/teddy.jpg',voice:'am_michael',speed:'0.95',src:'walt.mp3'},
];
const grid=document.getElementById('grid');
let cur=null,audio=null;
grid.innerHTML=PEOPLE.map(p=>`<article class="card" data-id="${p.id}">
  <img src="${p.img}" alt="${p.name}">
  <div class="meta">
    <b>${p.name}</b>
    <div class="vid">${p.voice} · ${p.speed}×${p.lang?' · lang '+p.lang:''}</div>
    <button class="play" type="button" aria-pressed="false" data-src="${p.src}" aria-label="Play ${p.name}">▶ Play</button>
  </div>
</article>`).join('');
function stop(){if(audio){audio.pause();audio=null}if(cur){cur.setAttribute('aria-pressed','false');cur.textContent='▶ Play';cur=null}}
grid.addEventListener('click',e=>{
  const b=e.target.closest('.play');if(!b)return;
  if(cur===b){stop();return}
  stop();
  audio=new Audio(b.dataset.src);
  audio.addEventListener('ended',stop);
  audio.addEventListener('error',stop);
  cur=b;b.setAttribute('aria-pressed','true');b.textContent='■ Stop';
  audio.play().catch(stop);
});
</script>
</body>
</html>
